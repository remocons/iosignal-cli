# Publishes one workspace package to npm when its tag is pushed: iosignal-cli@<version> or remocon@<version>,
# with npm Trusted Publishing (OIDC): no npm token is stored anywhere. Set up once per package on npmjs.com
# (iosignal-cli and remocon): Settings → Trusted Publisher → GitHub Actions, this repository, workflow file
# publish.yml, environment npm.
name: Publish to npm
on:
  push:
    tags: ['iosignal-cli@*', 'remocon@*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - name: Package and version from the tag
        id: tag
        run: |
          name="${GITHUB_REF_NAME%@*}"; version="${GITHUB_REF_NAME#*@}"
          case "$name" in iosignal-cli|remocon) ;; *) echo "unknown package $name"; exit 1 ;; esac
          actual="$(node -p "require('./packages/$name/package.json').version")"
          test "$actual" = "$version" || { echo "tag $GITHUB_REF_NAME does not match packages/$name $actual"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Already on npm (published by hand before the tag was pushed): nothing to do. The run ends as
          # success with a notice instead of failing, so no failure email; a wrong tag still fails above.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.skip != 'true'
        run: npm ci
      - if: steps.tag.outputs.skip != 'true'
        run: npm test
      - if: steps.tag.outputs.skip != 'true'
        run: npm publish -w "${{ steps.tag.outputs.name }}" --provenance --access public
