  <h2>장치 카드 하나씩: &lt;iosignal-device-card cid="…"&gt;</h2>
  <p class="note">CID는 "신호 보기" 페이지나 대시보드에서 확인합니다. 주소에 <code>?cid=1413,?k3vd</code>처럼 붙이면 그 장치들의 카드를 놓습니다.
    HTML에 <code>&lt;iosignal-device-card cid="1413"&gt;&lt;/iosignal-device-card&gt;</code>로 바로 적어도 됩니다.</p>
  <div class="cards" id="cards"></div>
