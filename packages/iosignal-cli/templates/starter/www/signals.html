<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신호 보기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>우리집</h1><nav aria-label="페이지">
  <a href="./">전체</a>
  <a href="room.html">거실</a>
  <a href="signals.html" aria-current="page">신호 보기</a>
  <a href="robot.html">로봇</a>
</nav></header>
<main>
  <p class="note">컴포넌트 없이 브라우저 클라이언트(<code>/lib/io.js</code>)만으로 장치를 찾고 명령을 보내는 예입니다. 코드는 signals.js.</p>
  <form id="searchForm"><button>#search 보내기</button> <span id="status" class="note">연결 중…</span></form>
  <div class="table-wrap"><table>
    <thead><tr><th>CID</th><th>$name</th><th>$ui</th><th>$state</th></tr></thead>
    <tbody id="devices"></tbody>
  </table></div>
  <h2>명령 보내기 (&lt;cid&gt;@)</h2>
  <form id="commandForm">
    <select id="target" aria-label="장치"></select>
    <input id="command" placeholder="toggle, level=30, step=10 …" aria-label="명령" required>
    <button>보내기</button>
  </form>
  <h2>받은 신호</h2>
  <div id="log"></div>
</main>
<script type="module" src="signals.js"></script>
</body>
</html>
